[package]
name = "yuki-desktop"
description = "Yuki — персональный AI voice/desktop assistant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Имя с суффиксом _lib обязательно: на Windows крейт библиотеки и бинарь
# не могут называться одинаково.
name = "yuki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api нужен ради прозрачного окна аватара на macOS (ТЗ §12):
# без него Tauri отказывается создавать transparent-окно.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
# Автозапуск вместе с системой (docs/GAPS.md §3).
tauri-plugin-autostart = "2"
# Автообновление (docs/GAPS.md §2).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Без подписчика все tracing::warn! уходят в пустоту.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rusqlite = { version = "0.32", features = ["bundled"] }
opener = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false }

yuki-ai = { workspace = true }
yuki-calendar = { workspace = true }
yuki-voice = { workspace = true }
yuki-mcp = { workspace = true }
yuki-system = { workspace = true }
yuki-filesystem = { workspace = true }
yuki-input = { workspace = true }
yuki-screen = { workspace = true }
yuki-accessibility = { workspace = true }

# Глобальные хоткеи существуют только на десктопе — на мобильных целях
# плагина нет, и безусловная зависимость сломала бы сборку под них.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
yuki-windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
yuki-macos = { workspace = true }
