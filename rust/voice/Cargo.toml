[package]
name = "yuki-voice"
description = "Голосовой конвейер: микрофон → VAD → STT → TTS (ТЗ §10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

# Захват микрофона: WASAPI на Windows, CoreAudio на macOS — одним API.
cpal = "0.15"
# Синтез речи средствами ОС: SAPI на Windows, AVSpeechSynthesizer на macOS.
# Ни моделей, ни сети, ни ключей — голос работает и в режиме Local Only (ТЗ §29).
tts = "0.26"
# WAV нужен, чтобы отдать сегмент речи в STT-эндпоинт.
hound = "3.5"
# Подавление шума (порт RNNoise). Микрофон ноутбука с сильным усилением даёт
# фон, в который упирается детектор речи: измеренный уровень 0,042…0,076 при
# пиках до 0,27. Чистая математика без моделей и без сети.
nnnoiseless = { version = "0.5", default-features = false }
# Детектор слова пробуждения. Свой (`wake.rs`) сравнивает MFCC с образцами
# напрямую; rustpotter делает то же самое, но с выравниванием по времени (DTW),
# нормализацией усиления и отсечкой по усреднённому образцу — то есть терпимее к
# темпу речи и к громкости, чем наша реализация. Работает целиком локально:
# ни сети, ни ключей, ни моделей в дистрибутиве — эталон строится из трёх
# записей самого пользователя (ТЗ §29).
rustpotter = { version = "3.0.2", default-features = false }
# Зависимость не используется в коде напрямую — она здесь ради версии.
# rustpotter тянет candle 0.2.2, а тот ждёт от `half` реализации распределений
# из rand_distr 0.4. Начиная с half 2.5 они переехали на rand_distr 0.5, и
# candle перестаёт собираться (`SampleUniform is not implemented for f16`).
# Точная версия 2.4.1 — последняя с нужным поколением, и она устраивает всех
# остальных потребителей `half` в дереве.
half = { version = "=2.4.1", features = ["rand_distr"] }
# Эталон слова пробуждения хранится в настройках строкой, а не массивом чисел.
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  # Блокирующий клиент нужен синтезу: `speak` обязан вернуться сразу, поэтому
  # запрос и воспроизведение живут в своём потоке — вне асинхронного рантайма.
  "blocking",
] }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_SpeechSynthesis", "Storage_Streams"] }
