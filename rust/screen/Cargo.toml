[package]
name = "yuki-screen"
description = "Снимки экрана и доступ к accessibility-дереву (ТЗ §6, §30 ScreenAdapter)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
yuki-system = { workspace = true }
yuki-accessibility = { workspace = true }
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Встроенный в Windows движок распознавания текста: в дистрибутив ничего не
# добавляется, языки берутся из установленных в системе (ТЗ §6).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation_Collections",
] }
